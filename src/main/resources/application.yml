server:
  servlet:
    context-path: /api
  error:
    whitelabel:
      enabled: false

security:
  jwt:
    secret-key: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
    expiration-time: 3600000

spring:
  application:
    name: airxelerate-api

  datasource:
    url: jdbc:h2:mem:airxelerateH2DB;DB_CLOSE_ON_EXIT=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true

debug: true
logging:
  level:
    root: error

